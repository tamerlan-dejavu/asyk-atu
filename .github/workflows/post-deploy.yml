name: Post-deploy smoke

# Vercel сообщает GitHub об успешном деплое (preview и production) — проверяем реальный адрес.
on:
  deployment_status:

permissions:
  contents: read
  issues: write
  statuses: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke against deployment
        run: npx playwright test
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = context.payload.deployment_status.environment_url || context.payload.deployment_status.target_url;
            const sha = context.payload.deployment.sha.slice(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy smoke failed (${sha})`,
              body: `Smoke-тест против ${url} упал для коммита ${sha}.\n\nЛоги: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nОткат: docs/RUNBOOK.md → «Откат деплоя».`,
              labels: ['deploy'],
            }).catch(() => github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Deploy smoke failed (${sha})`,
              body: `Smoke-тест против ${url} упал. ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            }));
